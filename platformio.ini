; Host-side unit tests: pio test -e native
; Builds against test/fake/Arduino.h instead of a real core. Projects using the
; library ignore this file and build it from library.json.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
; Only test_* folders are suites; test/fake holds the stand-in core.
test_filter = test_*
build_flags =
    -std=gnu++17
    -I src
    -I test/fake
    ; Compile every log line in, so the TRACE paths are built and checked too.
    -D MC_LOG_LEVEL=MC_LOG_TRACE
