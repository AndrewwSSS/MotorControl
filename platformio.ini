; Host-side unit tests for the library: pio test -e native
;
; The headers compile against test/fake/Arduino.h instead of a real core, so the
; stepping, endstop and homing logic can be checked on the Mac without a board.
; Sketches that use the library (Ruka, BigHardDick) never read this file - they
; build the library from library.json against their own board.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
; Only test_* folders are suites; test/fake holds the stand-in core.
test_filter = test_*
build_flags =
    -std=gnu++17
    -I src
    -I test/fake
    ; Compile every log line in, so the TRACE paths are built and checked too.
    -D MC_LOG_LEVEL=MC_LOG_TRACE
